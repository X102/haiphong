# Đăng trang lên GitHub Pages bằng GitHub Actions, chỉ đăng index.html và cau_hinh.json.
# Mặc định chỉ chạy khi bấm tay (Actions -> Trang web -> Run workflow), vì cách đơn giản nhất là
# Settings -> Pages -> Deploy from a branch: main, / (root); khi đó quy trình này không cần và nếu tự chạy sẽ báo lỗi.
# Muốn dùng quy trình này: Settings -> Pages -> Source: GitHub Actions, rồi bỏ dấu # ở hai dòng push bên dưới.
name: Trang web
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  dang:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.trienkhai.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom tệp đăng
        run: |
          mkdir _site
          cp index.html cau_hinh.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: trienkhai
        uses: actions/deploy-pages@v4
